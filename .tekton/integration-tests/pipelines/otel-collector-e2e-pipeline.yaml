---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: otel-collector-e2e-pipeline
spec:
  description: |
    Runs lightspeed-otel-collector e2e tests on a Konflux ephemeral OpenShift cluster (EaaS).
    Provisions the cluster, extracts the collector image from SNAPSHOT,
    runs the Go e2e tests (which deploy PG + collector themselves), then deprovisions.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'otel-collector-e2e-tests'
      type: string
    - name: namespace
      description: 'Namespace used for test resources'
      default: 'e2e-otel-collector'
      type: string
    - name: openshift-version-prefix
      description: 'Minor line prefix for eaas-get-latest-openshift-version-by-prefix (include trailing dot, e.g. 4.19.)'
      default: '4.19.'
      type: string
  tasks:
    - name: eaas-provision-space
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/build-definitions.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      params:
        - name: ownerKind
          value: PipelineRun
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
    - name: provision-cluster
      runAfter:
        - eaas-provision-space
      params:
        - name: openshift-version-prefix
          value: $(params.openshift-version-prefix)
      taskSpec:
        params:
          - name: openshift-version-prefix
            type: string
        results:
          - name: clusterName
            value: "$(steps.create-cluster.results.clusterName)"
        steps:
          - name: pick-version
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
            params:
              - name: prefix
                value: "$(params.openshift-version-prefix)"
          - name: create-cluster
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.eaas-provision-space.results.secretRef)
              - name: version
                value: "$(steps.pick-version.results.version)"
              - name: instanceType
                value: "m5.large"
    - name: run-e2e-tests
      description: Clone repo at SNAPSHOT revision, run e2e tests against ephemeral cluster.
      runAfter:
        - provision-cluster
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
          - name: namespace
            type: string
        results:
          - name: commit
            value: "$(steps.extract-image.results.commit)"
        volumes:
          - name: credentials
            emptyDir: {}
        steps:
          - name: get-kubeconfig
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.eaas-provision-space.results.secretRef)
              - name: clusterName
                value: "$(tasks.provision-cluster.results.clusterName)"
              - name: credentials
                value: credentials
          - name: extract-image
            results:
              - name: commit
                type: string
              - name: collector-image
                type: string
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              set -euo pipefail
              dnf -y install jq

              COLLECTOR_IMAGE="$(jq -r --arg name "${KONFLUX_COMPONENT_NAME}" \
                '.components[] | select(.name == $name) | .containerImage' <<< "$SNAPSHOT")"
              if [ -z "$COLLECTOR_IMAGE" ] || [ "$COLLECTOR_IMAGE" = "null" ]; then
                echo "ERROR: could not extract collector image from SNAPSHOT for component ${KONFLUX_COMPONENT_NAME}"
                echo "SNAPSHOT contents:"
                echo "$SNAPSHOT" | jq .
                exit 1
              fi
              echo "Collector image: ${COLLECTOR_IMAGE}"
              echo -n "${COLLECTOR_IMAGE}" > $(step.results.collector-image.path)

              COMMIT="$(jq -r --arg name "${KONFLUX_COMPONENT_NAME}" \
                '.components[] | select(.name == $name) | .source.git.revision' <<< "$SNAPSHOT")"
              if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
                echo "ERROR: could not extract git revision from SNAPSHOT"
                exit 1
              fi
              echo -n "${COMMIT}" > $(step.results.commit.path)
          - name: run-tests
            resources:
              requests:
                memory: "4Gi"
              limits:
                memory: "4Gi"
            onError: continue
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: OTEL_COLLECTOR_IMAGE
                value: "$(steps.extract-image.results.collector-image)"
              - name: TEST_NAMESPACE
                value: "$(params.namespace)"
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              set -euo pipefail
              dnf -y install git make golang

              COMMIT="$(cat $(steps.extract-image.results.commit.path))"
              git clone --depth=1 https://github.com/openshift/lightspeed-otel-collector.git /workspace/repo
              cd /workspace/repo
              git fetch --depth=1 origin "${COMMIT}"
              git checkout "${COMMIT}"

              # Create the test namespace on the ephemeral cluster.
              kubectl create namespace "${TEST_NAMESPACE}" 2>/dev/null || true

              echo "=== Running e2e tests ==="
              echo "OTEL_COLLECTOR_IMAGE=${OTEL_COLLECTOR_IMAGE}"
              echo "TEST_NAMESPACE=${TEST_NAMESPACE}"

              mkdir -p /workspace/konflux-artifacts
              cd test/e2e
              go test -tags=e2e -count=1 -v -timeout 15m ./... 2>&1 | tee /workspace/konflux-artifacts/e2e-test-output.log
          - name: gather-cluster-resources
            onError: continue
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: ARTIFACT_DIR
                value: "/workspace/konflux-artifacts"
              - name: NAMESPACE
                value: "$(params.namespace)"
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            script: |
              #!/bin/bash
              set -x
              cd "${ARTIFACT_DIR}"
              oc get pods -n "${NAMESPACE}" -o yaml > pods.yaml 2>/dev/null || true
              oc logs -n "${NAMESPACE}" deployment/otel-collector --tail=500 > collector-logs.txt 2>/dev/null || true
              oc logs -n "${NAMESPACE}" -l app=postgres --tail=200 > postgres-logs.txt 2>/dev/null || true
              oc get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' > events.txt 2>/dev/null || true
              echo "Artifacts gathered:"
              ls -la "${ARTIFACT_DIR}"
          - name: fail-if-any-step-failed
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: namespace
          value: "$(params.namespace)"
  finally:
    - name: export-logs-for-retention
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/export-logs/0.1/export-logs-to-quay.yaml
      params:
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: quay-repo
          value: "quay.io/openshift-lightspeed/ols-operator-artifacts"
        - name: artifact-credentials-secret
          value: ols-konflux-artifacts-bot
