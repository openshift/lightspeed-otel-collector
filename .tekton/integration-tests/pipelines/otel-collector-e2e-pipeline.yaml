---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: otel-collector-e2e-pipeline
spec:
  description: |
    Runs lightspeed-otel-collector e2e tests on a Konflux HyperShift hosted cluster.
    Provisions the cluster, extracts the collector image from SNAPSHOT,
    runs the Go e2e tests (which deploy PG + collector themselves).
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'otel-collector-e2e-tests'
      type: string
    - name: namespace
      description: 'Namespace used for test resources'
      default: 'e2e-otel-collector'
      type: string
    - name: openshift-version-prefix
      description: 'OpenShift minor version to provision (for example, 4.22).'
      default: '4.22'
      type: string
    - name: compute-node-type
      description: 'EC2 instance type for the ephemeral cluster compute nodes; m5.2xlarge = amd64, m6g.2xlarge = arm64.'
      type: string
      default: 'm5.2xlarge'
    - name: node-arch
      description: 'Compute node processor architecture; must match the compute-node-type instance family (m5* = amd64, m6g* = arm64).'
      type: string
      default: 'amd64'
  tasks:
    - name: validate-pipeline-params
      description: Reject params that cannot be safely embedded in the provisioning env JSON before provisioning starts.
      taskSpec:
        stepTemplate:
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          computeResources:
            limits:
              cpu: 100m
              memory: 128Mi
        steps:
          - name: validate-compute-node-type
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPUTE_NODE_TYPE
                value: $(params.compute-node-type)
            script: |
              #!/bin/sh
              # compute-node-type is substituted into the provision-ephemeral-cluster env JSON;
              # reject anything that is not a plain EC2 instance type so the JSON stays valid.
              # Use a whole-value case check (not grep): grep anchors apply per line, so a
              # value like 'm5.2xlarge\n"bad"' would pass and break the JSON.
              case "$COMPUTE_NODE_TYPE" in
                '')
                  echo "invalid compute-node-type: value is empty" >&2
                  exit 1
                  ;;
                *[!a-zA-Z0-9.-]*)
                  echo "invalid compute-node-type: '$COMPUTE_NODE_TYPE'" >&2
                  echo "must be a plain EC2 instance type (e.g. m5.2xlarge, m6g.2xlarge); quotes, spaces, newlines and special characters break the provisioning env JSON" >&2
                  exit 1
                  ;;
              esac
          - name: validate-node-arch
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: NODE_ARCH
                value: $(params.node-arch)
              - name: COMPUTE_NODE_TYPE
                value: $(params.compute-node-type)
            script: |
              #!/bin/sh
              # node-arch is substituted into the provision-ephemeral-cluster env JSON;
              # only amd64/arm64 are supported by the hypershift-hostedcluster workflow.
              # Validate before provisioning so a bad value fails fast instead of
              # after a 2h cluster provisioning timeout.
              case "$NODE_ARCH" in
                amd64|arm64) ;;
                *)
                  echo "invalid node-arch: '$NODE_ARCH'" >&2
                  echo "must be amd64 or arm64 (HYPERSHIFT_NODE_ARCH of hypershift-hostedcluster-create-hostedcluster)" >&2
                  exit 1
                  ;;
              esac
              # Cross-check node-arch against the compute-node-type instance family.
              # An arch/instance mismatch (e.g. default amd64 with m6g.2xlarge Graviton
              # instances) creates a cluster whose nodes cannot boot the payload.
              FAMILY=$(printf '%s' "$COMPUTE_NODE_TYPE" | sed -E 's/\..*$//')
              case "$FAMILY" in
                # g5g instances are arm64 (Graviton2) GPU instances; check them
                # before the generic GPU branch below, which assumes x86_64.
                g5g*)
                  if [ "$NODE_ARCH" != "arm64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' is an arm64 (Graviton2, g5g) GPU instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: arm64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Graviton (arm64) families carry a 'g' after the leading letter
                # (m6g, c7gn, m6gd, t4g, r7gz, ...); GPU families (g*, p*) are x86_64.
                g*|p*)
                  if [ "$NODE_ARCH" != "amd64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' looks like an x86_64 (GPU) instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: amd64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                ?*g*)
                  if [ "$NODE_ARCH" != "arm64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' is an arm64 (Graviton) instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: arm64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Common x86_64 families
                m[0-9]*|c[0-9]*|r[0-9]*|t[0-9]*|x[0-9]*|z[0-9]*|i[0-9]*|d[0-9]*|h[0-9]*)
                  if [ "$NODE_ARCH" != "amd64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' looks like an x86_64 instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: amd64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Unknown family: do not block, preserve existing behavior.
                *)
                  echo "note: could not determine architecture of instance family '$FAMILY'; skipping arch cross-check" >&2
                  ;;
              esac
    - name: provision-ephemeral-cluster
      runAfter:
        - validate-pipeline-params
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "$(params.compute-node-type)", "HYPERSHIFT_NODE_ARCH": "$(params.node-arch)", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2"}'
        - name: releases
          value: '{"latest":{"release":{"channel":"stable","version":"$(params.openshift-version-prefix)","architecture":"multi"}}}'
    - name: run-e2e-tests
      description: Clone repo at SNAPSHOT revision, run e2e tests against ephemeral cluster.
      runAfter:
        - provision-ephemeral-cluster
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
          - name: namespace
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        results:
          - name: commit
            value: "$(steps.extract-image.results.commit)"
        volumes:
          - name: cluster-credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: extract-image
            results:
              - name: commit
                type: string
              - name: collector-image
                type: string
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.19
            script: |
              set -euo pipefail
              dnf -y install jq

              COLLECTOR_IMAGE="$(jq -r --arg name "${KONFLUX_COMPONENT_NAME}" \
                '.components[] | select(.name == $name) | .containerImage' <<< "$SNAPSHOT")"
              if [ -z "$COLLECTOR_IMAGE" ] || [ "$COLLECTOR_IMAGE" = "null" ]; then
                echo "ERROR: could not extract collector image from SNAPSHOT for component ${KONFLUX_COMPONENT_NAME}"
                echo "SNAPSHOT contents:"
                echo "$SNAPSHOT" | jq .
                exit 1
              fi
              echo "Collector image: ${COLLECTOR_IMAGE}"
              echo -n "${COLLECTOR_IMAGE}" > $(step.results.collector-image.path)

              COMMIT="$(jq -r --arg name "${KONFLUX_COMPONENT_NAME}" \
                '.components[] | select(.name == $name) | .source.git.revision' <<< "$SNAPSHOT")"
              if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
                echo "ERROR: could not extract git revision from SNAPSHOT"
                exit 1
              fi
              echo -n "${COMMIT}" > $(step.results.commit.path)
          - name: run-tests
            resources:
              requests:
                memory: "4Gi"
              limits:
                memory: "4Gi"
            onError: continue
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: OTEL_COLLECTOR_IMAGE
                value: "$(steps.extract-image.results.collector-image)"
              - name: COMMIT
                value: "$(steps.extract-image.results.commit)"
              - name: TEST_NAMESPACE
                value: "$(params.namespace)"
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.19
            script: |
              set -euo pipefail
              dnf -y install git make golang

              git clone --depth=1 https://github.com/openshift/lightspeed-otel-collector.git /workspace/repo
              cd /workspace/repo
              git fetch --depth=1 origin "${COMMIT}"
              git checkout "${COMMIT}"

              # Create the test namespace on the ephemeral cluster.
              kubectl create namespace "${TEST_NAMESPACE}" 2>/dev/null || true

              echo "=== Running e2e tests ==="
              echo "OTEL_COLLECTOR_IMAGE=${OTEL_COLLECTOR_IMAGE}"
              echo "TEST_NAMESPACE=${TEST_NAMESPACE}"

              mkdir -p /workspace/konflux-artifacts
              cd test/e2e
              go test -tags=e2e -count=1 -v -timeout 15m ./... 2>&1 | tee /workspace/konflux-artifacts/e2e-test-output.log
          - name: gather-cluster-resources
            onError: continue
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: ARTIFACT_DIR
                value: "/workspace/konflux-artifacts"
              - name: NAMESPACE
                value: "$(params.namespace)"
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            script: |
              #!/bin/bash
              set -x
              cd "${ARTIFACT_DIR}"
              oc get deployment otel-collector -n "${NAMESPACE}" -o yaml > deployment.yaml 2>/dev/null || true
              oc get pods -n "${NAMESPACE}" -o yaml > pods.yaml 2>/dev/null || true
              oc logs -n "${NAMESPACE}" deployment/otel-collector --tail=500 > collector-logs.txt 2>/dev/null || true
              oc logs -n "${NAMESPACE}" deployment/otel-collector --previous --tail=500 > collector-previous-logs.txt 2>/dev/null || true
              oc logs -n "${NAMESPACE}" -l app=postgres --tail=200 > postgres-logs.txt 2>/dev/null || true
              oc get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' > events.txt 2>/dev/null || true
              echo "Artifacts gathered:"
              ls -la "${ARTIFACT_DIR}"
              for artifact in deployment.yaml pods.yaml events.txt collector-logs.txt collector-previous-logs.txt postgres-logs.txt; do
                if [ -s "${artifact}" ]; then
                  printf '\n=== %s ===\n' "${artifact}"
                  cat "${artifact}"
                else
                  printf '%s is empty or unavailable\n' "${artifact}"
                fi
              done
          - name: fail-if-any-step-failed
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: namespace
          value: "$(params.namespace)"
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
  finally:
    - name: export-logs-for-retention
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/export-logs/0.1/export-logs-to-quay.yaml
      params:
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: quay-repo
          value: "quay.io/openshift-lightspeed/ols-operator-artifacts"
        - name: artifact-credentials-secret
          value: ols-konflux-artifacts-bot
