# Router configuration.
# Routes telemetry to different destinations based on signal type and attributes.
#
# Routing rules:
#   - Logs   → lightspeed-service to PostgreSQL; unmatched logs to debug
#   - Traces → all to backend; allowlisted services also export traces for data collection as native JSONL
#   - Metrics → no pipeline defined, silently dropped

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /var/run/secrets/serving-cert/tls.crt
          key_file: /var/run/secrets/serving-cert/tls.key
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /var/run/secrets/serving-cert/tls.crt
          key_file: /var/run/secrets/serving-cert/tls.key

processors:
  batch:
    timeout: 1s
    send_batch_size: 100

# Exporters define all possible destinations and are referenced by pipelines.
# Route logs, traces and trace data collection through the connectors below.
exporters:
  # Lightspeed logs → PostgreSQL.
  postgres:
    connection_string: "postgres://otel:otel@postgres.db.svc:5432/oteldb?sslmode=require"
    schema: templogs
    logs_table: logs
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      storage: file_storage

   # Traces → external tracing backend (set endpoint to your Jaeger/Tempo/etc).
  otlp/tracing:
    endpoint: ${env:TRACES_BACKEND_ENDPOINT}
    tls:
      insecure: false

  # Allowlisted traces for data collection → native OTLP JSONL.
  file/data_collection:
    path: /var/lib/lightspeed-data/otel/traces.jsonl
    format: json
    create_directory: true
    rotation:
      max_megabytes: 1
      max_backups: 100
      max_days: 1

  # Debug — prints to stdout (remove in production).
  debug:
    verbosity: basic

# Routing connectors evaluate OTTL conditions and send matching telemetry to
# sub-pipelines. Unmatched telemetry follows configured defaults, if any;
# without a default pipeline, unmatched telemetry is dropped.
# Update the routing tables below to adjust logs, backend traces or trace data collection.
connectors:
  routing/logs:
    # No generic logs destination exists, so unmatched logs are dropped (debug).
    # To forward unmatched logs elsewhere, replace logs/unmatched exporter with
    # an otlp exporter pointing to a central logging backend.
    default_pipelines: [logs/unmatched]
    table:
      # Only Lightspeed components write audit logs to PostgreSQL.
      - condition: attributes["service.name"] == "lightspeed-service"
        pipelines: [logs/postgres]

  routing/traces:
    # Unlike logs, a shared tracing backend exists, so all traces (including
    # unmatched) are forwarded there by default.
    default_pipelines: [traces/lightspeed]
    table:
      # All traces go to the tracing backend. Add conditions here if you
      # need to route specific services differently in the future.
      - context: resource
        condition: "true"
        pipelines: [traces/lightspeed]

  # Only allowlisted services route traces to data collection.
  # Unmatched resources have no default route.
  routing/data_collection:
    table:
      - context: resource
        condition: attributes["service.name"] == "lightspeed-agentic-operator" or attributes["service.name"] == "lightspeed-agentic-sandbox"
        pipelines: [traces/data_collection]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  postgres_admin:
    endpoint: 0.0.0.0:8080
    connection_string: "postgres://otel:otel@postgres.db.svc:5432/oteldb?sslmode=require"
    schema: templogs
    logs_table: logs
    tls_cert_file: /var/run/secrets/serving-cert/tls.crt
    tls_key_file: /var/run/secrets/serving-cert/tls.key

  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    compaction:
      on_start: true
      directory: /var/lib/otelcol/file_storage/compaction

  https_metrics:
    endpoint: 0.0.0.0:8888
    upstream: http://127.0.0.1:18888/metrics
    tls_cert_file: /var/run/secrets/serving-cert/tls.crt
    tls_key_file: /var/run/secrets/serving-cert/tls.key

service:
  extensions: [health_check, file_storage, postgres_admin, https_metrics]

  pipelines:
    # --- Logs ---
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [routing/logs]

    logs/postgres:
      receivers: [routing/logs]
      exporters: [postgres]

    logs/unmatched:
      receivers: [routing/logs]
      exporters: [debug]

    # --- Traces ---
    # Do not batch here or in traces/data_collection: count-based batching can combine
    # valid requests into >1 MiB writes rejected by FileExporter after the
    # sender has already received success. Batch only the backend branch.
    traces:
      receivers: [otlp]
      exporters: [routing/traces, routing/data_collection]

    traces/lightspeed:
      receivers: [routing/traces]
      processors: [batch]
      exporters: [otlp/tracing]

    traces/data_collection:
      receivers: [routing/data_collection]
      exporters: [file/data_collection]

    # --- Metrics: no pipeline defined → silently dropped ---

  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '127.0.0.1'
                port: 18888
                without_type_suffix: true
                without_units: true
